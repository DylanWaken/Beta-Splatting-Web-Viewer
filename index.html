<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Beta Splatting Demo</title>
  <script type="importmap">
    {
        "imports": {
            "three": "./web/three.module.js",
            "betaview": "./web/betaviewSB.js"
        }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    body {
      background-color: #000000;
      height: 100vh;
      margin: 0px;
      position: relative;
    }

    #dropZone {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
      display: none;
    }

    #dropZone.dragover {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 120, 255, 0.2);
      border: 4px dashed #0078ff;
    }

    #dropZone.dragover::after {
      content: 'DROP PLY FILE HERE TO LOAD';
      color: #ffffff;
      font-size: 32px;
      font-weight: normal;
      font-family: 'VT323', monospace;
      letter-spacing: 8px;
      text-shadow: 2px 2px 0px #000000,
                  0 0 5px rgba(255, 255, 255, 0.7);
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeSpeed;
      pointer-events: none;
    }

    #infoBox {
      position: absolute;
      top: 10px;
      right: 10px;
      color: #ffffff;
      font-family: 'VT323', monospace;
      font-size: 16px;
      font-weight: normal;
      line-height: 1.6;
      background-color: rgba(0, 0, 0, 0.85);
      padding: 10px 15px;
      border-radius: 0px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      z-index: 999;
      white-space: nowrap;
      text-align: right;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0px #000000;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }

    .infoBoxHint {
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
    }

    .infoBoxFile {
      color: #ffffff;
      font-size: 16px;
    }

    #renderModeControls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 999;
    }

    .renderModeButton {
      font-family: 'VT323', monospace;
      font-size: 20px;
      font-weight: normal;
      letter-spacing: 3px;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.85);
      border: 2px solid #ffffff;
      padding: 10px 20px;
      cursor: pointer;
      text-shadow: 2px 2px 0px #000000;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      transition: all 0.2s;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }

    .renderModeButton:hover {
      background-color: rgba(42, 160, 147, 0.6);
      border-color: #2AA093;
      box-shadow: 0 0 15px rgba(42, 160, 147, 0.6);
      transform: translateY(-2px);
    }

    .renderModeButton.active {
      background-color: rgba(244, 162, 97, 0.9);
      border-color: #F4A261;
      box-shadow: 0 0 20px rgba(244, 162, 97, 0.8),
                  inset 0 0 10px rgba(255, 255, 255, 0.3);
      color: #000000;
      text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.5);
    }

  </style>

</head>

<body>
  <div id="dropZone"></div>
  <div id="infoBox">
    <div class="infoBoxHint">DRAG & DROP PLY FILES TO VIEW</div>
  </div>
  <div id="renderModeControls">
    <button class="renderModeButton active" data-mode="1">RGB</button>
    <button class="renderModeButton" data-mode="3">DIFFUSE</button>
    <button class="renderModeButton" data-mode="2">SPECULAR</button>
  </div>
  
  <script type="module">
    import * as BetaView from 'betaview';
    import * as THREE from 'three';
    
    let viewer = null;
    let currentLoadPromise = null;
    let isFirstLoad = true;
    
    const infoBox = document.getElementById('infoBox');
    
    // Initialize viewer
    function initViewer() {
      viewer = new BetaView.Viewer({
        'cameraUp': [0, 0, 1],
        'initialCameraPosition': [0, 1, 0],
        'initialCameraLookAt': [1, 0, 0],
      });
    }
    
    // Fully restart the viewer
    async function restartViewer() {
      console.log('Restarting viewer...');
      
      // Stop the viewer if it's running
      if (viewer) {
        try {
          if (viewer.selfDrivenModeRunning) {
            viewer.stop();
          }
          await viewer.dispose();
        } catch (error) {
          console.warn('Error disposing viewer:', error);
        }
        viewer = null;
      }
      
      // Small delay to ensure cleanup is complete
      await new Promise(resolve => setTimeout(resolve, 100));
      
      // Create a fresh viewer instance
      initViewer();
      console.log('Viewer restarted successfully');
    }
    
    // Load a scene from a path or file
    async function loadScene(pathOrFile, fileName = null) {
      console.log('Loading scene:', fileName || pathOrFile);
      
      // For dropped files, always restart the viewer
      if (!isFirstLoad) {
        await restartViewer();
      }
      isFirstLoad = false;
      
      // Ensure viewer exists
      if (!viewer) {
        initViewer();
      }
      
      try {
        const loadPromise = viewer.addSplatScene(pathOrFile, {
          'streamView': true
        });
        
        currentLoadPromise = loadPromise;
        
        await loadPromise;
        
        if (!viewer.selfDrivenModeRunning) {
          viewer.start();
        }
        updateFileInfo(fileName || pathOrFile);
        console.log('Scene loaded successfully:', fileName || pathOrFile);
        
      } catch (error) {
        console.error('Error loading scene:', error);
        if (error.message && !error.message.includes('abort')) {
          alert('Error loading file: ' + error.message);
        }
      }
    }
    
    // Update info box display
    function updateFileInfo(fileName) {
      if (fileName) {
        infoBox.innerHTML = `
          <div class="infoBoxHint">DRAG & DROP PLY FILES TO VIEW</div>
          <div class="infoBoxFile">LOADED: ${fileName.toUpperCase()}</div>
        `;
      }
    }
    
    // Render mode switching
    function setRenderMode(mode) {
      if (viewer && viewer.splatMesh && viewer.splatMesh.material && viewer.splatMesh.material.uniforms) {
        viewer.splatMesh.material.uniforms.renderMode.value = mode;
        viewer.forceRenderNextFrame();
        console.log('Render mode set to:', mode);
        
        // Update button states
        const buttons = document.querySelectorAll('.renderModeButton');
        buttons.forEach(btn => {
          if (parseInt(btn.dataset.mode) === mode) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
      }
    }
    
    // Add click handlers to render mode buttons
    document.querySelectorAll('.renderModeButton').forEach(button => {
      button.addEventListener('click', () => {
        const mode = parseInt(button.dataset.mode);
        setRenderMode(mode);
      });
    });
    
    // Drag and drop handlers
    const dropZone = document.getElementById('dropZone');
    
    document.body.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.add('dragover');
    });
    
    document.body.addEventListener('dragleave', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (e.target === document.body) {
        dropZone.classList.remove('dragover');
      }
    });
    
    document.body.addEventListener('drop', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('dragover');
      
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        const file = files[0];
        
        // Check if it's a PLY file
        if (!file.name.toLowerCase().endsWith('.ply')) {
          alert('Please drop a .ply file');
          return;
        }
        
        console.log('File dropped:', file.name);
        
        // Show loading UI immediately
        let loadingTaskId = null;
        if (viewer && viewer.loadingSpinner) {
          loadingTaskId = viewer.loadingSpinner.addTask('READING FILE.....');
        }
        
        // Create FileReader and set up handlers
        const reader = new FileReader();
        
        // Add progress tracking for file reading
        reader.onprogress = (event) => {
          if (event.lengthComputable && viewer && viewer.loadingSpinner && loadingTaskId) {
            const percentComplete = (event.loaded / event.total * 100).toFixed(0);
            viewer.loadingSpinner.setMessageForTask(loadingTaskId, `READING FILE..... ${percentComplete}%`);
          }
        };
        
        // Read file directly as ArrayBuffer instead of using blob URL
        reader.onload = async (event) => {
          try {
            // Restart viewer first
            await restartViewer();
            
            // Show loading screen
            if (viewer && viewer.showLoadingOverlay) {
              viewer.showLoadingOverlay('PROCESSING SPLATS.....');
            }
            
            // Load from the ArrayBuffer data directly
            console.log('Loading file data, size:', event.target.result.byteLength);
            const splatBuffer = await BetaView.PlyLoader.loadFromFileData(
              event.target.result,
              1,  // minimumAlpha
              0,  // compressionLevel
              0,  // sectionSize
              new THREE.Vector3(),  // sceneCenter
              undefined,  // blockSize
              undefined   // bucketSize
            );
            
            console.log('Splat buffer created, adding to viewer...');
            
            // Update loading message
            if (viewer && viewer.showLoadingOverlay) {
              viewer.showLoadingOverlay('BUILDING SCENE.....');
            }
            
            // Add the splat buffer to the viewer (with loading UI)
            await viewer.addSplatBuffers([splatBuffer], [{
              'splatAlphaRemovalThreshold': 1,
              'position': [0, 0, 0],
              'rotation': [0, 0, 0, 1],
              'scale': [1, 1, 1]
            }], true, true, true);
            
            // Start the viewer
            if (!viewer.selfDrivenModeRunning) {
              viewer.start();
            }
            
            // Hide loading screen
            if (viewer && viewer.hideLoadingOverlay) {
              viewer.hideLoadingOverlay();
            }
            
            // Remove spinner task
            if (viewer && viewer.loadingSpinner && loadingTaskId) {
              viewer.loadingSpinner.removeTask(loadingTaskId);
            }
            
            // Reset render mode to RGB (mode 1) after loading
            setRenderMode(1);
            
            updateFileInfo(file.name);
            console.log('Scene loaded successfully:', file.name);
            
          } catch (error) {
            console.error('Error loading dropped file:', error);
            // Hide loading on error
            if (viewer && viewer.hideLoadingOverlay) {
              viewer.hideLoadingOverlay();
            }
            if (viewer && viewer.loadingSpinner && loadingTaskId) {
              viewer.loadingSpinner.removeTask(loadingTaskId);
            }
            alert('Error loading file: ' + error.message);
          }
        };
        
        reader.onerror = (error) => {
          console.error('Error reading file:', error);
          if (viewer && viewer.hideLoadingOverlay) {
            viewer.hideLoadingOverlay();
          }
          if (viewer && viewer.loadingSpinner && loadingTaskId) {
            viewer.loadingSpinner.removeTask(loadingTaskId);
          }
          alert('Error reading file');
        };
        
        reader.readAsArrayBuffer(file);
      }
    });
    
    // Load default scene on startup
    const defaultPath = 'web/assets/bs/point_cloud.ply';
    loadScene(defaultPath, 'point_cloud.ply (default)');
  </script>
</body>

</html>
